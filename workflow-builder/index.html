// Automation-level lifecycle (Junaid, 25 Aug — "Needs attention" isn't a
// lifecycle stage the automation is IN, it's a flag on top of one: an
// automation with a blocked task hasn't stopped running, it's still Running,
// just also waiting on you. So it's a supplementary badge everywhere — the
// dashboard card, the Kanban column, the canvas header — never the primary
// status. Same reasoning killed "Generating plan" as its own status: from
// the dashboard it's indistinguishable from Draft — nothing's confirmed or
// running yet either way — so it's folded into Draft rather than adding a
// state nothing outside Plan Review can act on.) Five mutually exclusive
// primary states:
//   Draft      → prompt not yet submitted, or plan not yet confirmed
//   Scheduled  → plan confirmed, start deferred to a future time
//   Running    → confirmed and executing — even if a task is blocked on you
//   Paused     → the user deliberately stopped it (not a problem, a choice)

// ─── TASK TYPE + STATUS CONFIG ─────────────────────────────────────────────
// Automations are dependency-driven, not strictly sequential or parallel:
// a Task starts once every Task it depends on has completed. Tasks with no
// shared dependency can run at the same time. This mirrors Fred's Aug 21
// model: "The Planner determines dependencies between Tasks. A Task can
// start as soon as all of its dependencies are completed. Tasks that don't
// depend on each other can execute in parallel."
const TASK_TYPES = {
  variant:   { label: 'Create Variant',        color: '#E8DCF8' },
  targeting: { label: 'Configure Targeting',   color: '#DCE8FF' },

  finalize:  { label: 'Finalize',              color: '#FFE4D6' },
};

// A dependency counts as satisfied once its Task is done — whether it
// completed normally or was explicitly skipped by the user.
function isSatisfied(status) { return status === 'completed' || status === 'skipped'; }

  );

// Plan Review instead of jumping into workflow-detail. Shared by every
// place an automation can be opened from (dashboard panel, sidebar quick
// list) so none of them silently skips this check (Junaid, 25 Aug).
function openAutomation(a, onNavigate) {
  onNavigate(a.status === 'draft' ? 'plan-review' : 'workflow-detail', a);
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function Sidebar({ screen, onNavigate }) {
  const [pinnedOpen, setPinnedOpen] = useState(true);
  const [recentOpen, setRecentOpen] = useState(true);

  const isAutomate = screen === 'dashboard' || screen === 'new-workflow' || screen === 'workflow-detail' || screen === 'plan-review';

  const NavItem = ({ icon, label, active, onClick }) => (
    <button onClick={onClick}
      style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 8, padding: '10px 8px', borderRadius: 6, background: active ? '#F5F5FF' : 'none', border: 'none', cursor: 'pointer', transition: 'background .12s' }}
      onMouseOver={e => { if (!active) e.currentTarget.style.background = '#F9F9FB'; }}
      onMouseOut={e => { if (!active) e.currentTarget.style.background = 'none'; }}>
      <span style={{ color: active ? '#3838E7' : '#5E5D67', display: 'flex', alignItems: 'center', flexShrink: 0 }}>{icon}</span>
      <span style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: active ? '#3838E7' : '#1B1B23', letterSpacing: '0.25px', whiteSpace: 'nowrap' }}>{label}</span>
    </button>
  );

  // Chris (24 Aug): a standalone "+New automation" row doesn't add enough
  // value to earn its own line in the nav. Surface creation as a "+" that
  // only appears on hover of the Automation row instead.
  const [automationHover, setAutomationHover] = useState(false);
  const NavRowWithAdd = ({ icon, label, active, onClick, onAdd }) => (
    <div onMouseEnter={() => setAutomationHover(true)} onMouseLeave={() => setAutomationHover(false)}
      style={{ display: 'flex', alignItems: 'center', gap: 2 }}>
      <button onClick={onClick}
        style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8, padding: '10px 8px', borderRadius: 6, background: active ? '#F5F5FF' : 'none', border: 'none', cursor: 'pointer', transition: 'background .12s', minWidth: 0 }}
        onMouseOver={e => { if (!active) e.currentTarget.style.background = '#F9F9FB'; }}
        onMouseOut={e => { if (!active) e.currentTarget.style.background = 'none'; }}>
        <span style={{ color: active ? '#3838E7' : '#5E5D67', display: 'flex', alignItems: 'center', flexShrink: 0 }}>{icon}</span>
        <span style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: active ? '#3838E7' : '#1B1B23', letterSpacing: '0.25px', whiteSpace: 'nowrap' }}>{label}</span>
      </button>
      {automationHover && (
        <button onClick={onAdd} title="New automation"
          style={{ flexShrink: 0, width: 26, height: 26, borderRadius: 6, border: 'none', background: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#5E5D67' }}
          onMouseOver={e => e.currentTarget.style.background = '#F1F0F5'}
          onMouseOut={e => e.currentTarget.style.background = 'none'}>
          <svg width="14" height="14" viewBox="0 0 9.67 9.67" fill="none"><path d="M0.75 4.83H8.92M4.83 0.75V8.92" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/></svg>
        </button>
      )}
    </div>

  return (
    <div style={{ width: 270, background: '#fff', borderRight: '1px solid #E1DFE7', display: 'flex', flexDirection: 'column', flexShrink: 0, height: '100%' }}>
      <div style={{ flex: 1, overflowY: 'auto', padding: '8px 8px 0' }}>
        {/* Main actions */}
        <NavItem icon={<SvgIcon d={P.newChat} size={18} vw={16.5} vh={16.5}/>} label="New chat" active={screen === 'home'} onClick={() => onNavigate('home')}/>
        <NavItem icon={<svg width="18" height="18" viewBox="0 0 16 16.5" fill="none"><path d={P.gear1} stroke="#5E5D67" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/><path d={P.gear2} stroke="#5E5D67" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>} label="AI Settings" active={false} onClick={() => {}}/>

        {/* Separator */}
        <div style={{ borderBottom: '1px dashed #E1DFE7', margin: '4px 0 8px' }}/>

        {/* Automation — top-level entry in the main nav */}
        <NavRowWithAdd icon={<WorkflowIcon color={isAutomate ? '#3838E7' : '#5E5D67'}/>} label="Automation" active={isAutomate}
          onClick={() => onNavigate('dashboard')} onAdd={() => onNavigate('new-workflow')}/>

        {/* Separator */}
        <div style={{ borderBottom: '1px dashed #E1DFE7', margin: '8px 0' }}/>

        {/* Latest automations */}
        <div style={{ padding: '0 4px 8px' }}>
          <button onClick={() => setRecentOpen(!recentOpen)} style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'none', border: 'none', cursor: 'pointer', padding: '4px 0', marginBottom: 4 }}>

            <svg width="9" height="6" viewBox="0 0 9.5 5.5" fill="none" style={{ transform: recentOpen ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>
              <path d="M8.75 4.75L4.75 0.75L0.75 4.75" stroke="#5E5D67" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>

          </button>
          {recentOpen && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {AUTOMATIONS.slice(0, 4).map((a) => (

                  onMouseOver={e => e.currentTarget.style.background = '#FCFCFD'}
                  onMouseOut={e => e.currentTarget.style.background = 'none'}>
                  <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', display: 'block' }}>{a.name}</span>

        {/* Pinned automates */}

            <svg width="9" height="6" viewBox="0 0 9.5 5.5" fill="none" style={{ transform: pinnedOpen ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>

          </button>
          {pinnedOpen && (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {['how can I update my setting', 'I want to know the segment build...'].map((item, i) => (

                  onMouseOut={e => e.currentTarget.style.background = 'none'}>
                  <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', flex: 1 }}>{item}</span>
                </div>

            </div>

        </div>
      </div>

      {/* Bottom */}
      <div style={{ borderTop: '1px solid #E1DFE7', flexShrink: 0 }}>
        <button style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 8, padding: '14px 12px', background: 'none', border: 'none', cursor: 'pointer', transition: 'background .12s' }}
          onMouseOver={e => e.currentTarget.style.background = '#F5F5FF'}
          onMouseOut={e => e.currentTarget.style.background = 'none'}>
          <SvgIcon d={P.backArrow} size={18} vw={6} vh={10.5}/>
          <span style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#1B1B23' }}>Back to app</span>
        </button>
        <button style={{ width: '100%', display: 'flex', alignItems: 'center', gap: 8, padding: '14px 12px', background: 'none', border: 'none', borderTop: '1px solid #E1DFE7', cursor: 'pointer', transition: 'background .12s' }}
          onMouseOver={e => e.currentTarget.style.background = '#F5F5FF'}
          onMouseOut={e => e.currentTarget.style.background = 'none'}>
          <SvgIcon d={P.collapse} size={18} vw={15} vh={15}/>
          <span style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#1B1B23' }}>Collapse</span>
        </button>
      </div>
    </div>
  );
}

// ─── SCREEN 2: WORKFLOWS DASHBOARD ──────────────────────────────────────────
function StatusBadge({ status }) {
  const cfg = AUTOMATION_STATUS[status] || AUTOMATION_STATUS.draft;
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, color: cfg.color, background: cfg.bg, padding: '3px 10px', borderRadius: 20, letterSpacing: '0.2px', whiteSpace: 'nowrap' }}>
      <span style={{ width: 6, height: 6, borderRadius: '50%', background: cfg.color }}/>
      {cfg.label}
    </span>
  );
}

// Small roll-up chips shown on a dashboard row: "2 subtasks need attention",
// "3 subtasks ready for review". Uses the same amber as ATTENTION_BADGE —
// a blocked task doesn't mean something's broken, it means it's waiting on
// you, same as the automation's own primary status (Junaid, 25 Aug).
function SubtaskChip({ kind, count }) {
  const cfg = {
    blocked: { color: ATTENTION_BADGE.color, bg: ATTENTION_BADGE.bg, label: 'need attention', icon: '⚠' },
    review:  { color: '#00875A', bg: '#E6F9F3', label: 'ready for review', icon: '✓' },
    running: { color: '#3838E7', bg: '#EEF0FF', label: 'in progress', icon: '◷' },
  }[kind];
  return (
    <span style={{ display: 'inline-flex', alignItems: 'center', gap: 5, fontFamily: 'Roboto, sans-serif', fontSize: 12, color: cfg.color, background: cfg.bg, padding: '3px 9px', borderRadius: 6, whiteSpace: 'nowrap' }}>
      <span style={{ fontSize: 11 }}>{cfg.icon}</span>
      {count} subtask{count === 1 ? '' : 's'} {cfg.label}
    </span>
  );
}

// Description + progress line + roll-up chips — shared between the
// dashboard's side panel and the canvas's Tasks tab so the same automation
// shows literally the same summary whichever way you opened it (Junaid,
// 25 Aug: "the tasks tab should follow the exact same design as the
// sidepanel in the dashboard").
function AutomationProgressSummary({ description, progressLabel, counts }) {
  const [descOpen, setDescOpen] = useState(false);
  const isLong = description && description.length > 120;
  const shortDesc = isLong && !descOpen ? description.slice(0, 120) + '…' : description;
  const noSubtasks = counts.blocked === 0 && counts.review === 0 && counts.running === 0;
  return (
    <div>
      <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 6 }}>Short description</div>
      <p style={{ fontFamily: 'Roboto, sans-serif', fontSize: 13, color: '#1B1B23', lineHeight: 1.55, margin: '0 0 4px' }}>{shortDesc}</p>
      {isLong && (
        <button onClick={() => setDescOpen(!descOpen)} style={{ background: 'none', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#3838E7', marginBottom: 16 }}>
          {descOpen ? 'Show less' : 'Show more'}
        </button>
      )}

      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 12, marginBottom: 6 }}>
        <span style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px' }}>Automation progress</span>
        <span title="Derived from the status of every task in this automation" style={{ color: '#C7C5D0', fontSize: 12, cursor: 'help' }}>ⓘ</span>
      </div>
      <p style={{ fontFamily: 'Roboto, sans-serif', fontSize: 13, color: '#1B1B23', margin: '0 0 14px' }}>{progressLabel}</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 18 }}>
        {counts.blocked > 0 && <SubtaskChip kind="blocked" count={counts.blocked}/>}
        {counts.review > 0 && <SubtaskChip kind="review" count={counts.review}/>}
        {counts.running > 0 && <SubtaskChip kind="running" count={counts.running}/>}
        {noSubtasks && <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A' }}>No subtasks to show yet.</span>}
      </div>
    </div>
  );
}

// One row in the dashboard list. Selecting it opens the detail panel on the
// right — resolving blockers happens there, not by opening the automation.
function AutomationRow({ automation: a, selected, onSelect }) {
  const cfg = AUTOMATION_STATUS[a.status] || AUTOMATION_STATUS.draft;
  const [hover, setHover] = useState(false);
  return (
    <div onClick={() => onSelect(a)}
      onMouseOver={() => setHover(true)} onMouseOut={() => setHover(false)}
      style={{ display: 'flex', alignItems: 'center', gap: 16, background: selected ? '#F5F5FF' : '#fff', border: `1px solid ${selected ? '#3838E7' : (hover ? '#C7C5D0' : '#E1DFE7')}`, borderRadius: 10, padding: '14px 18px 14px 0', cursor: 'pointer', transition: 'border-color .12s, background .12s', overflow: 'hidden' }}>
      <div style={{ width: 4, alignSelf: 'stretch', background: cfg.bar, flexShrink: 0, borderRadius: '10px 0 0 10px', marginRight: 2 }}/>
      <div style={{ flex: 1, minWidth: 0, paddingLeft: 12 }}>
        <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 600, fontSize: 14, color: '#1B1B23', marginBottom: 3 }}>{a.name}</div>
        <div style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A' }}>
          Created by <span style={{ fontWeight: 500, color: '#52515B' }}>{a.createdBy}</span> · {a.createdAgo}
        </div>
        {(a.blocked.length > 0 || a.readyForReview.length > 0) && (
          <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 8 }}>
            {a.blocked.length > 0 && <SubtaskChip kind="blocked" count={a.blocked.length}/>}
            {a.readyForReview.length > 0 && <SubtaskChip kind="review" count={a.readyForReview.length}/>}
          </div>
        )}
      </div>
      <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: 4, flexShrink: 0 }}>
        <StatusBadge status={a.status}/>
        {a.scheduledAt && <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A' }}>{a.scheduledAt}</span>}
        {a.repeats && <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A' }}>⟳ {a.repeats}</span>}
      </div>
    </div>
  );
}

// Collapsible group of subtasks. Blocked/review items carry an action that
// opens the item in chat (see WorkflowDetailView's "reviewing" flow) so the
// same component and the same interaction work identically whether it's
// shown on the dashboard or inside the automation itself — per Chris
// (24 Aug): "the dashboard tasks view and the one inside the edit page are
// supposed to be identical."
function SubtaskGroup({ kind, title, items, defaultOpen, onAnswer, onOpen }) {
  const [open, setOpen] = useState(!!defaultOpen);
  const cfg = {
    blocked: { color: ATTENTION_BADGE.color, bg: ATTENTION_BADGE.bg, border: '#F5DDB8', icon: '⚠' },
    review:  { color: '#00875A', bg: '#fff',    border: '#E1DFE7', icon: '✓' },
    running: { color: '#3838E7', bg: '#fff',    border: '#E1DFE7', icon: '◷' },
    waiting: { color: '#918F9A', bg: '#fff',    border: '#E1DFE7', icon: '○' },
    done:    { color: '#00B37A', bg: '#fff',    border: '#E1DFE7', icon: '✓' },
  }[kind];
  const actionable = kind === 'blocked' || kind === 'review';
  if (!items.length) return null;
  return (
    <div style={{ border: `1px solid ${cfg.border}`, background: cfg.bg, borderRadius: 10, marginBottom: 10, overflow: 'hidden' }}>
      <button onClick={() => setOpen(!open)}
        style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 8, padding: '11px 14px', background: 'none', border: 'none', cursor: 'pointer' }}>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: cfg.color }}>
          <span>{cfg.icon}</span>{title}
        </span>
        <span style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <span style={{ background: cfg.color, color: '#fff', fontFamily: 'Roboto, sans-serif', fontWeight: 600, fontSize: 11, minWidth: 18, height: 18, borderRadius: 9, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: '0 5px' }}>{items.length}</span>
          <svg width="9" height="6" viewBox="0 0 9.5 5.5" fill="none" style={{ transform: open ? 'rotate(180deg)' : 'none', transition: 'transform .15s' }}>
            <path d="M8.75 4.75L4.75 0.75L0.75 4.75" stroke="#5E5D67" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
          </svg>
        </span>
      </button>
      {open && (
        <div style={{ padding: '0 10px 10px', display: 'flex', flexDirection: 'column', gap: 8 }}>
          {items.map(it => (
            <div key={it.id} onClick={() => onOpen && onOpen(it)}
              style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', gap: 10, background: '#fff', border: '1px solid #E1DFE7', borderRadius: 8, padding: '10px 12px', cursor: onOpen ? 'pointer' : 'default' }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#1B1B23' }}>{it.label}</div>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A', marginTop: 2 }}>{it.waiting}</div>
              </div>
              {actionable && (
                <button onClick={e => { e.stopPropagation(); onAnswer(kind, it); }}
                  style={{ flexShrink: 0, padding: '6px 14px', background: kind === 'blocked' ? '#3838E7' : '#fff', color: kind === 'blocked' ? '#fff' : '#3838E7', border: kind === 'blocked' ? 'none' : '1px solid #3838E7', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>
                  {kind === 'blocked' ? 'Answer' : 'Review'}
                </button>
              )}
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

// Fred's flow: Prompt → Plan generation → user reviews/validates the plan →
// Pending (queued) → Execution. The automation does NOT start on submit; the
// Planner proposes tasks and the user explicitly confirms before anything runs.
const PLANNED_TASKS = [
  { id: '1', type: 'variant',   label: 'Create Variant — Popup',  desc: 'Newsletter signup popup, shown at 50% scroll', dependsOn: [] },
  { id: '2', type: 'variant',   label: 'Create Variant — Banner', desc: 'Newsletter signup banner, shown at 50% scroll', dependsOn: [] },
  { id: '3', type: 'targeting', label: 'Configure Targeting',     desc: 'New homepage visitors, trigger at 50% scroll depth', dependsOn: [] },
  { id: '4', type: 'goal',      label: 'Create Goals',            desc: 'Track CTA clicks and registrations', dependsOn: [] },
  { id: '5', type: 'traffic',   label: 'Configure Traffic + GA4', desc: 'Split traffic equally, enable GA4 integration', dependsOn: [] },
  { id: '6', type: 'validate',  label: 'Validate Configuration',  desc: 'Check all tasks are complete before finalizing', dependsOn: ['1','2','3','4','5'] },
  { id: '7', type: 'finalize',  label: 'Finalize & Launch',       desc: 'Launch the experiment', dependsOn: ['6'] },
];

function PlanReviewScreen({ draft, onNavigate }) {
  // phase: generating → questions → ready
  const [phase, setPhase] = useState('generating');
  const [answers, setAnswers] = useState({});
  const layout = computeLayout(PLANNED_TASKS);
  const connections = getConnections(PLANNED_TASKS);

  useEffect(() => {
    const t = setTimeout(() => setPhase('questions'), 1400);
    return () => clearTimeout(t);
  }, []);

  const questions = [
    { key: 'audience', q: 'Which audience should this task target?', options: ['All visitors', 'New visitors', 'Returning visitors'] },
    { key: 'kpi', q: 'What is the primary KPI to optimize?', options: ['Conversion rate', 'Revenue per visitor', 'Click-through rate'] },
  ];
  const allAnswered = questions.every(q => answers[q.key]);

  function submitAnswers() { setPhase('ready'); }

  // The prompt, the clarifying Q&A, and the confirmation itself all become
  // the Chat tab's starting history once the automation is confirmed —
  // Junaid (25 Aug): "the original prompt, agent's responses, approval
  // steps, should all be persistent in the chat," not reset to empty.
  function buildChatSeed() {
    const seed = [
      { from: 'user', text: draft?.description || 'Test three new checkout button variants against the current design and promote the best performer.' },
      { from: 'kai', text: `Analyzed your request and broke it into ${PLANNED_TASKS.length} tasks.` },
    ];
    questions.forEach(q => {
      if (!answers[q.key]) return;
      seed.push({ from: 'kai', text: q.q });
      seed.push({ from: 'user', text: answers[q.key] });
    });
    seed.push({ from: 'kai', text: `Plan ready for your review — ${PLANNED_TASKS.length} tasks. Five can start immediately; validation waits for all of them, and launch waits for validation.` });
    seed.push({ from: 'user', text: 'Confirm plan & queue' });

// Derives edges [sourceId, targetId] straight from each node's dependsOn.
// This is the single source of truth for the graph — auto-layout, edge
// rendering, and the (+) insertion buttons all read from this.
function getConnections(nodes) {
  return nodes.flatMap(n => (n.dependsOn || []).map(depId => [depId, n.id]));
}

// ─── CANVAS GRID LAYOUT ──────────────────────────────────────────────────────
// Cards are laid out on a strict grid rather than free-positioned. A task's
// COLUMN is how deep it sits in the dependency chain (no dependencies = first
// column), and tasks sharing a column stack in ROWS. Positions are derived,
// never stored — so there is nothing to "auto-arrange".
const NODE_W = 252, NODE_H = 118, COL_GAP = 84, ROW_GAP = 26, PAD = 8;
const COL_PITCH = NODE_W + COL_GAP, ROW_PITCH = NODE_H + ROW_GAP;

function computeLayout(nodes) {
  const byId = Object.fromEntries(nodes.map(n => [n.id, n]));
  const depth = {};
  const resolve = (id, seen) => {
    if (depth[id] !== undefined) return depth[id];
    if (seen.has(id)) return 0;               // guard against cycles
    seen.add(id);
    const deps = (byId[id]?.dependsOn || []).filter(d => byId[d]);
    const v = deps.length ? Math.max(...deps.map(d => resolve(d, seen))) + 1 : 0;
    depth[id] = v;
    return v;
  };
  nodes.forEach(n => resolve(n.id, new Set()));

  const columns = {};
  nodes.forEach(n => {
    const c = depth[n.id];
    (columns[c] = columns[c] || []).push(n.id);
  });

  const pos = {};
  Object.entries(columns).forEach(([c, ids]) => {
    ids.forEach((id, row) => {
      pos[id] = { col: +c, row, x: PAD + +c * COL_PITCH, y: PAD + row * ROW_PITCH };
    });
  });

  const colCount = Object.keys(columns).length;
  const rowCount = Math.max(...Object.values(columns).map(a => a.length));
  return { pos, width: PAD * 2 + colCount * COL_PITCH - COL_GAP, height: PAD * 2 + rowCount * ROW_PITCH - ROW_GAP };
}

// Right-angle connector from the right edge of the source card to the left
// edge of the target — straight across when they share a row, elbowed when
// they don't. No diagonals.
function elbowPath(a, b) {
  const x1 = a.x + NODE_W, y1 = a.y + NODE_H / 2;
  const x2 = b.x,          y2 = b.y + NODE_H / 2;
  if (Math.abs(y1 - y2) < 1) return `M ${x1} ${y1} H ${x2}`;
  const midX = x1 + COL_GAP / 2;
  return `M ${x1} ${y1} H ${midX} V ${y2} H ${x2}`;
}

// The dependency-arrow layer, shared by the Plan Review graph (before
// anything has run, so every edge is "not done" — dashed) and the canvas
// (where a satisfied dependency turns solid) — Junaid (25 Aug): the same
// parallel-vs-sequential structure should read the same way in both places.
function DependencyEdges({ connections, layout, isDone }) {
  return (
    <svg style={{ position: 'absolute', inset: 0, width: layout.width, height: layout.height, pointerEvents: 'none', overflow: 'visible' }}>
      <defs>
        <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="2.5" orient="auto">
          <polygon points="0 0, 6 2.5, 0 5" fill="#C7C5D0"/>
        </marker>
      </defs>
      {connections.map(([a, b]) => {
        const pa = layout.pos[a], pb = layout.pos[b];
        if (!pa || !pb) return null;
        const done = isDone ? isDone(a) : false;
        return (
          <path key={`${a}-${b}`} d={elbowPath(pa, pb)} fill="none"
            stroke={done ? '#B9B7C4' : '#D9D7E0'} strokeWidth="1.5"
            strokeDasharray={done ? undefined : '5,4'}
            strokeLinejoin="round" markerEnd="url(#arrow)"/>
        );
      })}
    </svg>
  );
}

// Read-only task card for the Plan Review graph — no status yet (nothing

// Turns a blocked/failed Task into the shape SubtaskGroup and the chat flow
// both expect. This is what "opens" when a user clicks Answer/Retry — a
// question to resolve, not a one-click state flip.
function nodeToItem(node) {
  if (node.status === 'failed') {
    return {
      id: node.id, label: node.label, waiting: 'Failed', type: 'retry',
      question: `"${node.label}" failed to complete. What would you like to do?`,
      preview: node.failReason || 'The build step returned an error and could not finish automatically.',
    };
  }
  if (node.id === '5') {
    return {
      id: node.id, label: node.label, waiting: 'Needs input', type: 'select',
      question: 'Which GA4 property should this task report conversions to?',
      options: ['acme-run-prod (GA4)', 'acme-run-staging (GA4)', 'Skip GA4 for now'],
    };
  }
  return {
    id: node.id, label: node.label, waiting: 'Needs input', type: 'approve',
    question: `"${node.label}" is ready — review before it continues.`,
    preview: node.desc,
  };
}

// A completed variant is an asset a human should still look at, even though
// it isn't blocking anything — Chris's "ready for review" category.
function variantToReviewItem(node) {
  return {
    id: node.id, label: node.label, waiting: 'Built', type: 'approve',
    question: `Review the ${node.elementType || 'variant'} before it ships.`,
    preview: node.changeSummary || node.desc,
    visual: node.elementType,
  };
}

function WorkflowDetailView({ workflow, onNavigate }) {
  const [selected, setSelected] = useState(null);
  // A freshly confirmed plan is queued, not running: every task starts at
  // "not started" until the user kicks execution off.
  const [nodes, setNodes] = useState(
    workflow?.justConfirmed
      ? WORKFLOW_NODES.map(n => ({ ...n, status: 'not_started' }))
      : WORKFLOW_NODES
  );
  const [hoveredEdge, setHoveredEdge] = useState(null);
  const [insertDialogEdge, setInsertDialogEdge] = useState(null);
  // Right panel is persistent and tabbed so the canvas and the task statuses
  // are visible at the same time, and prompt-based editing stays available.
  const [panelTab, setPanelTab] = useState('tasks');
  // Seeded from the Plan Review conversation when arriving via "Confirm
  // plan & queue" — the prompt and approval steps that got this automation
  // here shouldn't vanish just because the screen changed (Junaid, 25 Aug).
  const [chatLog, setChatLog] = useState(workflow?.chatSeed || []);
  const [chatInput, setChatInput] = useState('');
  const chatEndRef = useRef(null);
  // Every new message (including a ReviewCard just posted by openReview)
  // should be visible without the user having to scroll for it.
  useEffect(() => { chatEndRef.current?.scrollIntoView({ block: 'nearest' }); }, [chatLog, panelTab]);
  // The item currently being resolved via chat — set, the panel jumps to
  // Chat and a ReviewCard is posted there; the canvas stays put. This is the
  // single resolution path for both blocked tasks and ready-for-review
  // assets, on the canvas and from the dashboard alike (Chris, 24 Aug).
  const [reviewing, setReviewing] = useState(null);
  const [requestingChanges, setRequestingChanges] = useState(false);
  useEffect(() => { setRequestingChanges(false); }, [reviewing]);
  // Header affordances that replaced the removed Configuration tab — Chris:
  // "give users a more intuitive way to edit the name and scheduling."
  const [nameEditing, setNameEditing] = useState(false);
  const [nameValue, setNameValue] = useState(workflow?.name || 'Newsletter Signup Automation');
  const [scheduleOpen, setScheduleOpen] = useState(false);
  const [scheduleMode, setScheduleMode] = useState('now');
  // A user-level pause, independent of any task's own status — Junaid
  // (25 Aug): consolidates the header's status pill and Run button into one
  // control ("Run automation" → "Running"/"Scheduled", with Pause).
  const [paused, setPaused] = useState(false);

  const selectedNode = nodes.find(n => n.id === selected);
  const connections = getConnections(nodes);
  const layout = computeLayout(nodes);
  const hasStarted = nodes.some(n => (n.status || 'not_started') !== 'not_started');

  // Persists automatically — Junaid (24 Aug): a manual Save button was
  // overkill for something that should just always be saved.
  useEffect(() => { WORKFLOW_NODES = nodes; }, [nodes]);

  // Arriving from the dashboard's Answer/Review button: jump straight into
  // the same chat + preview flow, carrying the exact item the user clicked
  // on the dashboard, whether or not it maps to a node in this graph.
  useEffect(() => {
    if (workflow?.focusItem) openReview(workflow.focusKind, workflow.focusItem);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  // Automation-level status, derived from every Task's status rather than
  // stored separately — this is the "what does completed/blocked mean for
  // the whole Automation" question Fred answered on Aug 21. Uses the same
  // vocabulary as AUTOMATION_STATUS on the dashboard (Junaid, 25 Aug):
  // a blocked task doesn't change the primary status away from Running —
  // it's a supplementary flag (needsAttention) shown alongside it, same as
  // the dashboard card badges.
  const statuses = nodes.map(n => n.status || 'not_started');
  const needsAttention = statuses.some(s => s === 'failed' || s === 'action_required');
  const automationStatus = statuses.some(s => s === 'in_progress') || needsAttention
    ? 'running'
    : statuses.every(s => s === 'completed' || s === 'skipped')
    ? 'completed'
    : 'queued';
  const automationStatusLabel = {
    running: 'Running',
    completed: 'Completed',
    queued: 'Queued',
  }[automationStatus];
  const automationStatusColors = {
    running: { bg: '#EEF0FF', color: '#3838E7' },
    completed: { bg: '#E6F9F3', color: '#00B37A' },
    queued: { bg: '#F5F5F7', color: '#918F9A' },
  }[automationStatus];

  function handleNodePropertyChange(nodeId, propertyName, value) {
    setNodes(prevNodes => prevNodes.map(n =>
      n.id === nodeId ? { ...n, [propertyName]: value } : n
    ));
  }

  // Resolves a blocked/failed Task, then cascades: any Task whose
  // dependencies are now all satisfied moves from "not started" to
  // "running" automatically — this is the dependency-driven execution
  // model, not something the user has to trigger by hand.
  function resolveNode(nodeId, newStatus) {
    setNodes(prevNodes => {
      let next = prevNodes.map(n => n.id === nodeId ? { ...n, status: newStatus } : n);
      let changed = true;
      while (changed) {
        changed = false;
        next = next.map(n => {
          if ((n.status || 'not_started') !== 'not_started') return n;
          const deps = n.dependsOn || [];
          const ready = deps.every(depId => {
            const dep = next.find(x => x.id === depId);
            return dep && isSatisfied(dep.status);
          });
          if (ready) { changed = true; return { ...n, status: 'in_progress' }; }
          return n;
        });
      }
      return next;
    });
  }

  // Opens an item (already in {label, waiting, type, question, ...} shape —
  // see nodeToItem/variantToReviewItem) in the chat + preview flow. Items
  // carried over from the dashboard for automations without a full graph
  // work the same way; answerReview just has nothing to cascade.
  function openReview(kind, item) {
    setReviewing({ kind, item });
    setPanelTab('chat');
    setSelected(null);
    // Keyed on kind+id, not just id: the same node can surface here twice
    // with different questions (e.g. blocked, then later ready for review),
    // and each occasion needs its own card in the log.
    const seedKey = `${kind}:${item.id}`;
    setChatLog(log => log.some(m => m.seed === seedKey)
      ? log
      : [...log, { from: 'kai', seed: seedKey, text: item.question || `Let's take a look at "${item.label}".`, card: { kind, item } }]);
  }

  // Resolves whatever's being reviewed. If it maps to a real node, this
  // drives the same dependency cascade as everywhere else in the model;
  // dashboard-only items (from other, unmodeled automations) just get a
  // chat confirmation since there's no graph to update.
  function answerReview(result) {
    const { kind, item } = reviewing;
    const node = nodes.find(n => n.id === item.id);
    let kaiReply = 'Got it.';

    if (kind === 'blocked' && item.type === 'retry') {
      if (result.outcome === 'retried') { if (node) resolveNode(node.id, 'completed'); kaiReply = `Retried "${item.label}" — it's completed now.`; }
      else { if (node) resolveNode(node.id, 'skipped'); kaiReply = `Skipped "${item.label}".`; }
    } else if (kind === 'blocked') {
      if (node) resolveNode(node.id, 'completed');
      kaiReply = result.value ? `Confirmed "${result.value}" — resuming "${item.label}".` : `Confirmed — resuming "${item.label}".`;
    } else {
      // Reviewing an already-built asset: approving just closes it out;
      // requesting changes sends the task itself back to Action required
      // with the feedback attached, which is what moves it back into the
      // Blocked group automatically.
      if (result.outcome === 'changes') {
        if (node) setNodes(prev => prev.map(n => n.id === node.id ? { ...n, status: 'action_required', reworkNote: result.value } : n));
        kaiReply = `Sent "${item.label}" back for changes: “${result.value}”.`;
      } else {
        kaiReply = `Approved "${item.label}".`;
      }
    }

    setChatLog(log => [...log, { from: 'kai', text: kaiReply }]);
    setReviewing(null);
  }

  // Kicks off a queued automation: every task whose dependencies are already
  // satisfied starts at once — that's the parallel bit of the model.
  function startExecution() {
    setNodes(prev => prev.map(n => {
      if ((n.status || 'not_started') !== 'not_started') return n;
      const ready = (n.dependsOn || []).every(id => {
        const dep = prev.find(x => x.id === id);
        return dep && isSatisfied(dep.status);
      });
      return ready ? { ...n, status: 'in_progress' } : n;
    }));
  }

  function insertNodeOnEdge(sourceId, targetId, nodeType) {
    // Find next available ID
    const maxId = Math.max(...nodes.map(n => parseInt(n.id)));
    const newId = String(maxId + 1);

    if (!nodes.find(n => n.id === sourceId) || !nodes.find(n => n.id === targetId)) return;

    // Create the new task depending only on the edge's source — the target's
    // dependency is rewired below to point here instead, so the graph stays
    // consistent. Position is derived by the grid layout, never stored.
    const newNode = {
      id: newId,
      type: nodeType,
      label: `New ${TASK_TYPES[nodeType].label}`,
      desc: 'Configure this task',
      dependsOn: [sourceId],
      status: 'not_started',
    };

    // Add default properties based on type
    if (nodeType === 'variant') {
      newNode.elementType = 'popup';
      newNode.changeSummary = '';
    } else if (nodeType === 'targeting') {
      newNode.audience = 'new-visitors';
      newNode.triggerCondition = '';
    } else if (nodeType === 'goal') {
      newNode.goalType = 'click';
      newNode.trackedElement = '';
    } else if (nodeType === 'traffic') {
      newNode.trafficSplit = 50;
      newNode.integration = 'ga4';
    } else if (nodeType === 'finalize') {
      newNode.launchMode = 'immediate';
    }

    // Rewire the target so it now depends on the new node instead of the
    // original source — this keeps dependsOn as the single source of truth
    // for the graph rather than just repositioning boxes on screen.
    const rewiredNodes = nodes.map(n =>
      n.id === targetId
        ? { ...n, dependsOn: (n.dependsOn || []).map(d => d === sourceId ? newId : d) }
        : n
    );

    setNodes([...rewiredNodes, newNode]);
    setInsertDialogEdge(null);
    setSelected(newId);
  }

  return (
    <div style={{ flex: 1, display: 'flex', flexDirection: 'column', background: '#FCFCFD', overflow: 'hidden' }}>
      {/* Sub-header */}
      <div style={{ background: '#fff', borderBottom: '1px solid #E1DFE7', padding: '0 24px', flexShrink: 0 }}>
        {/* Breadcrumb + actions row */}
        <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '16px 0' }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
            <button onClick={() => onNavigate('dashboard')}
              style={{ display: 'flex', alignItems: 'center', gap: 5, background: 'none', border: 'none', cursor: 'pointer', fontFamily: 'Roboto, sans-serif', fontSize: 13, color: '#918F9A', padding: 0 }}
              onMouseOver={e => e.currentTarget.style.color = '#1B1B23'}
              onMouseOut={e => e.currentTarget.style.color = '#918F9A'}>
              <svg width="12" height="10" viewBox="0 0 6 10.5" fill="none"><path d={P.backArrow} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              Workflows
            </button>
            <span style={{ color: '#C7C5D0', fontFamily: 'Roboto, sans-serif', fontSize: 13 }}>/</span>
            {/* Chris (24 Aug): the Configuration tab wasn't earning its
                keep — give users a more direct way to rename and schedule
                instead of a whole tab for it. */}
            {nameEditing ? (
              <input value={nameValue} onChange={e => setNameValue(e.target.value)} autoFocus
                onBlur={() => setNameEditing(false)}
                onKeyDown={e => { if (e.key === 'Enter') setNameEditing(false); }}
                style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 600, fontSize: 16, color: '#1B1B23', border: '1px solid #3838E7', borderRadius: 6, padding: '2px 7px', outline: 'none', minWidth: 180 }}/>
            ) : (
              <button onClick={() => setNameEditing(true)} title="Rename"
                style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', padding: '2px 4px', cursor: 'pointer', borderRadius: 6 }}
                onMouseOver={e => e.currentTarget.style.background = '#F5F5FF'}
                onMouseOut={e => e.currentTarget.style.background = 'none'}>
                <span style={{ fontFamily: 'Montserrat, sans-serif', fontWeight: 600, fontSize: 16, color: '#1B1B23' }}>{nameValue}</span>
                <span style={{ color: '#918F9A', fontSize: 12 }}>✎</span>
              </button>
            )}
          </div>
          {/* Consolidated status + primary action — Junaid (25 Aug): a
              separate status pill, schedule button, and Run button said
              overlapping things. Before launch it's just "when" (schedule)
              + "go" (Run); once running, the schedule question is moot, so
              the whole area collapses into one status pill with Pause/
              Resume next to it. */}
          <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
            {!hasStarted ? (
              <>
                <div style={{ position: 'relative' }}>
                  <button onClick={() => setScheduleOpen(o => !o)}
                    style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: '#fff', border: '1px solid #E1DFE7', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#1B1B23', cursor: 'pointer' }}
                    onMouseOver={e => e.currentTarget.style.background = '#F5F5FF'}
                    onMouseOut={e => e.currentTarget.style.background = '#fff'}>
                    ◷ {scheduleMode === 'now' ? 'Runs immediately' : 'Scheduled'}
                  </button>
                  {scheduleOpen && (
                    <div className="fade-up" style={{ position: 'absolute', top: '110%', right: 0, background: '#fff', border: '1px solid #E1DFE7', borderRadius: 8, padding: 12, width: 220, boxShadow: '0 8px 20px rgba(0,0,0,0.1)', zIndex: 50 }}>
                      <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, color: '#52515B', marginBottom: 8 }}>When should this run?</div>
                      {[['now', 'Now'], ['later', 'Later']].map(([m, label]) => (
                        <button key={m} onClick={() => setScheduleMode(m)}
                          style={{ display: 'block', width: '100%', textAlign: 'left', padding: '8px 10px', marginBottom: 6, borderRadius: 6, border: `1px solid ${scheduleMode === m ? '#3838E7' : '#E1DFE7'}`, background: scheduleMode === m ? '#F5F5FF' : '#fff', fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#1B1B23', cursor: 'pointer' }}>
                          {label}
                        </button>
                      ))}
                      {scheduleMode === 'later' && (
                        <input type="datetime-local" style={{ width: '100%', padding: '7px 9px', border: '1px solid #E1DFE7', borderRadius: 6, fontFamily: 'Roboto, sans-serif', fontSize: 12, marginBottom: 8, boxSizing: 'border-box' }}/>
                      )}
                      <button onClick={() => setScheduleOpen(false)}
                        style={{ width: '100%', padding: '7px', background: '#3838E7', border: 'none', borderRadius: 6, color: '#fff', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>
                        Done
                      </button>
                    </div>
                  )}
                </div>
                {scheduleMode === 'later' ? (
                  <span style={{ background: '#EEF0FF', color: '#3838E7', fontFamily: 'Roboto, sans-serif', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 20 }}>📅 Scheduled</span>
                ) : (
                  <button onClick={startExecution}
                    style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: '#3838E7', border: 'none', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#fff', cursor: 'pointer' }}
                    onMouseOver={e => e.currentTarget.style.background = '#2828C7'}
                    onMouseOut={e => e.currentTarget.style.background = '#3838E7'}>
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 1.5L11.5 6.5L2.5 11.5V1.5Z" fill="#fff"/></svg>
                    Run automation
                  </button>
                )}
              </>
            ) : paused ? (
              <>
                <span style={{ background: '#F1F0F5', color: '#918F9A', fontFamily: 'Roboto, sans-serif', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 20 }}>⏸ Paused</span>
                <button onClick={() => setPaused(false)}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: '#3838E7', border: 'none', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#fff', cursor: 'pointer' }}>
                  <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><path d="M2.5 1.5L11.5 6.5L2.5 11.5V1.5Z" fill="#fff"/></svg>
                  Resume
                </button>
              </>
            ) : automationStatus === 'completed' ? (
              <span style={{ background: automationStatusColors.bg, color: automationStatusColors.color, fontFamily: 'Roboto, sans-serif', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 20 }}>✓ {automationStatusLabel}</span>
            ) : (
              <>
                {/* Primary status is Running even while a task is blocked
                    on you — "Needs attention" rides alongside it as a
                    supplementary badge, never replaces it (Junaid, 25 Aug). */}
                <span style={{ background: automationStatusColors.bg, color: automationStatusColors.color, fontFamily: 'Roboto, sans-serif', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 20 }}>
                  ● {automationStatusLabel}
                </span>
                {needsAttention && (
                  <span style={{ background: ATTENTION_BADGE.bg, color: ATTENTION_BADGE.color, fontFamily: 'Roboto, sans-serif', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 20 }}>
                    ⚠ {ATTENTION_BADGE.label}
                  </span>
                )}
                <button onClick={() => setPaused(true)}
                  style={{ display: 'flex', alignItems: 'center', gap: 6, padding: '7px 14px', background: '#fff', border: '1px solid #E1DFE7', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#1B1B23', cursor: 'pointer' }}
                  onMouseOver={e => e.currentTarget.style.background = '#F5F5FF'}
                  onMouseOut={e => e.currentTarget.style.background = '#fff'}>
                  ⏸ Pause
                </button>
              </>
            )}
          </div>
        </div>
        {/* Generated info bar — the whole Automation traces back to one prompt */}
        <div style={{ paddingBottom: 12 }}>
          <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', fontStyle: 'italic' }}>
            "{workflow?.description || 'Create an experiment on Page X with two newsletter variations (popup and banner), target new homepage visitors. Show the variations when the user scrolls 50% of the page content, track CTA clicks and registrations, split traffic equally, and enable GA4.'}"
          </span>
        </div>
      </div>

      {/* Canvas + side panel */}
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        {/* Canvas column: scrolling grid, with the legend pinned underneath so
            it can never overlap the cards. Stays visible even while a task/
            asset is being resolved via chat — the ReviewCard lives in the
            chat log instead of swapping out this view (Junaid, 24 Aug). */}
        <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', background: '#FCFCFD', minWidth: 0 }}>
        <div style={{ flex: 1, overflow: 'auto', padding: 24 }}>
          <div className="canvas-grid" style={{ background: '#fff', border: '1px solid #E1DFE7', borderRadius: 10, padding: 28, minHeight: '100%', display: 'inline-block' }}>
            {/* Grid stage — sized to the computed layout so the card grid and
                the connector layer share one coordinate space. */}
            <div style={{ position: 'relative', width: layout.width, height: layout.height }}>
              {/* Right-angle connectors derived from dependsOn — same
                  component as the Plan Review graph (Junaid, 25 Aug), so a
                  satisfied dependency turning solid here is the exact same
                  visual language as "not done yet" was there. A task with
                  several dependents fans out; a task depending on several
                  others converges them — no special-cased branch logic. */}
              <DependencyEdges connections={connections} layout={layout}
                isDone={id => isSatisfied(nodes.find(n => n.id === id)?.status)}/>

              <svg style={{ position: 'absolute', inset: 0, width: layout.width, height: layout.height, pointerEvents: 'none', overflow: 'visible' }}>
                {/* (+) insertion affordance, parked on the connector's elbow */}
                {connections.map(([a, b]) => {
                  const pa = layout.pos[a], pb = layout.pos[b];
                  if (!pa || !pb) return null;
                  const cx = pa.x + NODE_W + COL_GAP / 2;
                  const cy = (pa.y + pb.y) / 2 + NODE_H / 2;
                  const key = `${a}-${b}`;
                  const on = hoveredEdge === key;
                  return (
                    <g key={`edge-${key}`} style={{ pointerEvents: 'all', cursor: 'pointer' }}
                       onMouseEnter={() => setHoveredEdge(key)}
                       onMouseLeave={() => setHoveredEdge(null)}
                       onClick={() => setInsertDialogEdge([a, b])}>
                      <circle cx={cx} cy={cy} r={16} fill="transparent"/>
                      {on && (
                        <>
                          <circle cx={cx} cy={cy} r={13} fill="#3838E7"/>
                          <path d={`M ${cx - 5} ${cy} H ${cx + 5} M ${cx} ${cy - 5} V ${cy + 5}`}
                            stroke="#fff" strokeWidth="1.8" strokeLinecap="round" pointerEvents="none"/>
                        </>
                      )}
                    </g>
                  );
                })}
              </svg>

              {/* Cards */}
              {nodes.map(node => (
                layout.pos[node.id] && (
                  <NodeBox key={node.id} node={node} pos={layout.pos[node.id]} selected={selected === node.id}
                    onClick={() => { setSelected(selected === node.id ? null : node.id); setPanelTab('tasks'); }}
                    allNodes={nodes} onResolve={resolveNode}
                    onReview={n => openReview('blocked', nodeToItem(n))}/>
                )
              ))}
            </div>

          </div>
        </div>

        {/* Legend strip — outside the scroll area so it never covers a card */}
        <div style={{ borderTop: '1px solid #E1DFE7', background: '#fff', padding: '9px 24px', display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 16, flexShrink: 0 }}>
          <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
            {Object.entries(TASK_TYPES).map(([type, cfg]) => (
              <div key={type} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 9, height: 9, borderRadius: 3, background: cfg.color, border: '1px solid #E1DFE7' }}/>
                <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A' }}>{cfg.label}</span>
              </div>
            ))}
          </div>
          <div style={{ width: 1, height: 14, background: '#E1DFE7' }}/>
          <div style={{ display: 'flex', alignItems: 'center', flexWrap: 'wrap', gap: 10 }}>
            {Object.entries(STATUS_CONFIG).filter(([s]) => s !== 'skipped').map(([status, cfg]) => (
              <div key={status} style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
                <div style={{ width: 9, height: 9, borderRadius: '50%', background: cfg.color }}/>
                <span style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A' }}>{cfg.label}</span>
              </div>
            ))}
          </div>
        </div>
        </div>

        {/* Node insertion dialog */}
        {insertDialogEdge && (
          <div style={{ position: 'fixed', inset: 0, background: 'rgba(0,0,0,0.4)', display: 'flex', alignItems: 'center', justifyContent: 'center', zIndex: 1000 }}>
            <div className="fade-up" style={{ background: '#fff', borderRadius: 12, padding: 24, minWidth: 320, boxShadow: '0 20px 25px -5px rgba(0,0,0,0.1)' }}>
              <h3 style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 600, fontSize: 16, color: '#1B1B23', marginBottom: 4 }}>Insert Task</h3>
              <p style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', marginBottom: 18 }}>The new task will depend on the step before it — dependents get rewired automatically</p>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 18 }}>
                {Object.keys(TASK_TYPES).filter(t => t !== 'validate').map(type => (
                  <button
                    key={type}
                    onClick={() => insertNodeOnEdge(insertDialogEdge[0], insertDialogEdge[1], type)}
                    style={{
                      padding: '12px',
                      border: '1px solid #E1DFE7',
                      borderRadius: 8,
                      background: '#fff',
                      cursor: 'pointer',
                      fontFamily: 'Roboto, sans-serif',
                      fontSize: 13,
                      color: '#1B1B23',
                      fontWeight: 500,
                      transition: 'all 0.15s',
                      display: 'flex',
                      alignItems: 'center',
                      gap: 8
                    }}
                    onMouseOver={e => {
                      e.currentTarget.style.background = '#F5F5FF';
                      e.currentTarget.style.borderColor = '#3838E7';
                    }}
                    onMouseOut={e => {
                      e.currentTarget.style.background = '#fff';
                      e.currentTarget.style.borderColor = '#E1DFE7';
                    }}>
                    <span style={{ width: 12, height: 12, borderRadius: 2, background: TASK_TYPES[type].color }}/>
                    {TASK_TYPES[type].label}
                  </button>
                ))}
              </div>

              <button
                onClick={() => setInsertDialogEdge(null)}
                style={{
                  width: '100%',
                  padding: '9px',
                  background: 'transparent',
                  border: '1px solid #E1DFE7',
                  borderRadius: 7,
                  fontFamily: 'Roboto, sans-serif',
                  fontWeight: 500,
                  fontSize: 13,
                  color: '#918F9A',
                  cursor: 'pointer',
                  transition: 'all 0.15s'
                }}
                onMouseOver={e => {
                  e.currentTarget.style.background = '#F5F5FF';
                  e.currentTarget.style.color = '#1B1B23';
                }}
                onMouseOut={e => {
                  e.currentTarget.style.background = 'transparent';
                  e.currentTarget.style.color = '#918F9A';
                }}>
                Cancel
              </button>
            </div>
          </div>
        )}

        {/* Right panel — persistent + tabbed. Canvas and status stay visible
            together. Configuration was removed as its own tab per Chris
            (24 Aug) — renaming/scheduling moved into the header instead, and
            resolving tasks happens here, in Chat. */}
        <div style={{ width: 380, borderLeft: '1px solid #E1DFE7', background: '#fff', display: 'flex', flexDirection: 'column', flexShrink: 0, overflow: 'hidden' }}>
          {/* Tab bar */}
          <div style={{ display: 'flex', borderBottom: '1px solid #E1DFE7', flexShrink: 0 }}>
            {[['tasks', 'Tasks'], ['chat', 'Chat']].map(([key, label]) => (
              <button key={key} onClick={() => { setPanelTab(key); setSelected(null); }}
                style={{ flex: 1, padding: '13px 0', background: 'none', border: 'none', borderBottom: panelTab === key ? '2px solid #3838E7' : '2px solid transparent', cursor: 'pointer', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: panelTab === key ? '#3838E7' : '#918F9A', marginBottom: -1 }}>
                {label}
              </button>
            ))}
          </div>

          {/* Chat gets its own flex column so the input bar is a fixed
              footer, not just the last thing in a scrolling page — Junaid
              (24 Aug): the input was invisible without scrolling all the
              way down. Tasks/task-detail keep the simple whole-pane scroll
              since they have no pinned footer to protect. */}
          {panelTab === 'chat' ? (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', overflow: 'hidden', padding: '18px 20px' }}>
            <div style={{ flex: 1, overflow: 'auto', marginBottom: 12 }}>
              {chatLog.length === 0 ? (
                <p style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', lineHeight: 1.6, margin: 0 }}>
                  Describe a change and Kai will update the plan — e.g. “add a third variant”, or “only target mobile visitors”. The canvas stays visible while you do.
                </p>
              ) : (
                <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
                  {chatLog.map((m, i) => (
                    <div key={i} style={{ alignSelf: m.from === 'user' ? 'flex-end' : 'flex-start', maxWidth: m.card ? '100%' : '85%', display: 'flex', flexDirection: 'column', gap: 8 }}>
                      <div style={{ background: m.from === 'user' ? '#3838E7' : '#F5F5F7', color: m.from === 'user' ? '#fff' : '#1B1B23', padding: '9px 12px', borderRadius: 10, fontFamily: 'Roboto, sans-serif', fontSize: 12, lineHeight: 1.5 }}>
                        {m.text}
                      </div>
                      {m.card && <ReviewCard kind={m.card.kind} item={m.card.item}/>}
                    </div>
                  ))}
                  <div ref={chatEndRef}/>
                </div>
              )}
            </div>

            {/* Quick actions for whatever's being reviewed — the fastest
                path is a tap, but typing in the input below works too. */}
            {reviewing && !requestingChanges && (
              <div className="fade-up" style={{ marginBottom: 10, flexShrink: 0 }}>
                {reviewing.item.type === 'select' && (
                  <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                    {reviewing.item.options.map(opt => (
                      <button key={opt} onClick={() => { setChatLog(l => [...l, { from: 'user', text: opt }]); answerReview({ outcome: 'confirmed', value: opt }); }}
                        style={{ padding: '7px 14px', borderRadius: 20, border: '1px solid #3838E7', background: '#fff', color: '#3838E7', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>
                        {opt}
                      </button>
                    ))}
                  </div>
                )}
                {reviewing.kind === 'blocked' && reviewing.item.type === 'retry' && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => { setChatLog(l => [...l, { from: 'user', text: 'Retry' }]); answerReview({ outcome: 'retried' }); }}
                      style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E03D3D', background: '#fff', color: '#E03D3D', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>Retry</button>
                    <button onClick={() => { setChatLog(l => [...l, { from: 'user', text: 'Skip' }]); answerReview({ outcome: 'skipped' }); }}
                      style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E1DFE7', background: '#fff', color: '#52515B', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>Skip</button>
                  </div>
                )}
                {reviewing.item.type === 'approve' && (
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => setRequestingChanges(true)}
                      style={{ flex: 1, padding: '8px', borderRadius: 8, border: '1px solid #E1DFE7', background: '#fff', color: '#52515B', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>Request changes</button>
                    <button onClick={() => { setChatLog(l => [...l, { from: 'user', text: 'Approve' }]); answerReview({ outcome: 'approved' }); }}
                      style={{ flex: 1, padding: '8px', borderRadius: 8, border: 'none', background: '#3838E7', color: '#fff', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, cursor: 'pointer' }}>{reviewing.kind === 'blocked' ? 'Approve & resume' : 'Approve'}</button>
                  </div>
                )}
              </div>
            )}
            {reviewing && requestingChanges && (
              <p style={{ fontFamily: 'Roboto, sans-serif', fontSize: 11, color: '#918F9A', margin: '0 0 8px', flexShrink: 0 }}>Type what should change below, then press Enter.</p>
            )}

            <div style={{ border: '1px solid #E1DFE7', borderRadius: 10, padding: '10px 12px', display: 'flex', gap: 8, flexShrink: 0 }}>
              <input value={chatInput} onChange={e => setChatInput(e.target.value)}
                onKeyDown={e => {
                  if (e.key !== 'Enter' || !chatInput.trim()) return;
                  const text = chatInput.trim();
                  if (reviewing && requestingChanges) {
                    setChatLog(l => [...l, { from: 'user', text }]);
                    answerReview({ outcome: 'changes', value: text });
                  } else {
                    setChatLog(l => [...l, { from: 'user', text }, { from: 'kai', text: 'Updated the plan. Review the affected tasks on the canvas.' }]);
                  }
                  setChatInput('');
                }}
                placeholder={reviewing && requestingChanges ? 'What should change? Press Enter to send…' : 'Ask for a change to this automation…'}
                style={{ flex: 1, border: 'none', outline: 'none', fontFamily: 'Roboto, sans-serif', fontSize: 13, color: '#1B1B23', background: 'transparent', minWidth: 0 }}/>
            </div>
          </div>
          ) : (
          <div style={{ flex: 1, overflowY: 'auto', padding: '18px 20px' }}>
          {/* ── Task detail (drills in from canvas or Tasks list) ── */}
          {selectedNode ? (
          <div className="fade-up">
            <button onClick={() => setSelected(null)}
              style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', padding: 0, cursor: 'pointer', fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 12, color: '#3838E7', marginBottom: 14 }}>
              <svg width="10" height="8" viewBox="0 0 6 10.5" fill="none"><path d={P.backArrow} stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
              All tasks
            </button>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>
              <div style={{ display: 'flex', gap: 10 }}>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 6 }}>Task Type</div>
                  <div style={{ display: 'inline-block', background: TASK_TYPES[selectedNode.type].color, padding: '4px 10px', borderRadius: 6, fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#1B1B23' }}>{TASK_TYPES[selectedNode.type].label}</div>
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 6 }}>Status</div>
                  <div style={{ display: 'inline-block', background: STATUS_CONFIG[selectedNode.status || 'not_started'].bg, color: STATUS_CONFIG[selectedNode.status || 'not_started'].color, padding: '4px 10px', borderRadius: 6, fontFamily: 'Roboto, sans-serif', fontWeight: 600, fontSize: 12 }}>{STATUS_CONFIG[selectedNode.status || 'not_started'].label}</div>
                </div>
              </div>
              <div>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 6 }}>Label</div>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontSize: 13, color: '#1B1B23', fontWeight: 500 }}>{selectedNode.label}</div>
              </div>
              <div>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 6 }}>Description</div>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#918F9A', lineHeight: 1.5 }}>{selectedNode.desc}</div>
              </div>

              {/* Type-specific form fields */}
              <div style={{ borderTop: '1px solid #E1DFE7', paddingTop: 14 }}>
                <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 12 }}>Configuration</div>
                {renderNodeForm(selectedNode, handleNodePropertyChange, nodes)}
              </div>

              {(selectedNode.dependsOn || []).length > 0 && (
                <div style={{ borderTop: '1px solid #E1DFE7', paddingTop: 14 }}>
                  <div style={{ fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 11, color: '#52515B', textTransform: 'uppercase', letterSpacing: '0.6px', marginBottom: 8 }}>Depends On</div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                    {selectedNode.dependsOn.map(depId => {
                      const dep = nodes.find(n => n.id === depId);
                      if (!dep) return null;
                      const sc = STATUS_CONFIG[dep.status || 'not_started'];
                      return (
                        <div key={depId} style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontFamily: 'Roboto, sans-serif', fontSize: 12, color: '#1B1B23' }}>
                          <span style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                            <span style={{ width: 6, height: 6, borderRadius: '50%', background: sc.color, flexShrink: 0 }}/>
                            {dep.label}
                          </span>
                          <span style={{ color: sc.color, fontWeight: 600, fontSize: 10, textTransform: 'uppercase' }}>{sc.label}</span>
                        </div>
                      );
                    })}
                  </div>
                </div>
              )}
              <button style={{ width: '100%', padding: '9px', background: '#3838E7', border: 'none', borderRadius: 7, fontFamily: 'Roboto, sans-serif', fontWeight: 500, fontSize: 13, color: '#fff', cursor: 'pointer', marginTop: 4 }}
                onMouseOver={e => e.currentTarget.style.background = '#2828C7'}
                onMouseOut={e => e.currentTarget.style.background = '#3838E7'}>
                Edit Task
              </button>
            </div>
          </div>

          /* ── Tasks tab: same grouped list as the dashboard panel, same
                 SubtaskGroup component, same Answer/Review action — Chris
                 (24 Aug): these two views are "supposed to be identical." ── */
          ) : (() => {
            const blockedItems = nodes.filter(n => n.status === 'failed' || n.status === 'action_required').map(nodeToItem);
            const reviewNodes = nodes.filter(n => n.type === 'variant' && n.status === 'completed');
            const reviewItems = reviewNodes.map(variantToReviewItem);
            const runningItems = nodes.filter(n => n.status === 'in_progress').map(n => ({ id: n.id, label: n.label, waiting: 'In progress' }));
            const reviewedIds = new Set(reviewNodes.map(n => n.id));
            const waitingItems = nodes.filter(n => (n.status || 'not_started') === 'not_started').map(n => ({ id: n.id, label: n.label, waiting: 'Waiting on dependencies' }));
            const doneItems = nodes.filter(n => (n.status === 'completed' || n.status === 'skipped') && !reviewedIds.has(n.id))
              .map(n => ({ id: n.id, label: n.label, waiting: n.status === 'skipped' ? 'Skipped' : 'Completed' }));
            const completedCount = nodes.filter(n => n.status === 'completed' || n.status === 'skipped').length;
            const progressLabel = automationStatus === 'completed'
              ? 'All tasks completed'
              : needsAttention
              ? `${blockedItems.length} task${blockedItems.length === 1 ? '' : 's'} need attention`
              : automationStatus === 'running'
              ? `Running (Task ${completedCount}/${nodes.length} complete)`
              : 'Queued — hasn’t started yet';

            return (
              <div>
                {/* Same description/progress/roll-up summary as the
                    dashboard's side panel — Junaid (25 Aug). */}
                <AutomationProgressSummary description={workflow?.description} progressLabel={progressLabel}
                  counts={{ blocked: blockedItems.length, review: reviewItems.length, running: runningItems.length }}/>
                <SubtaskGroup kind="blocked" title={`${blockedItems.length} task${blockedItems.length === 1 ? '' : 's'} need attention`}
                  items={blockedItems} defaultOpen
                  onAnswer={(kind, item) => openReview(kind, item)}
                  onOpen={it => setSelected(it.id)}/>
                <SubtaskGroup kind="review" title="Assets ready for review" items={reviewItems}
                  onAnswer={(kind, item) => openReview(kind, item)}
                  onOpen={it => setSelected(it.id)}/>
                <SubtaskGroup kind="running" title="In progress" items={runningItems} onOpen={it => setSelected(it.id)}/>
                <SubtaskGroup kind="waiting" title="Waiting on dependencies" items={waitingItems} onOpen={it => setSelected(it.id)}/>
                <SubtaskGroup kind="done" title="Completed" items={doneItems} onOpen={it => setSelected(it.id)}/>
              </div>
            );
          })()}
          </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ─────────────────────────────────────────────────────────────────
function App() {
  const [screen, setScreen] = useState('home');
  const [currentWorkflow, setCurrentWorkflow] = useState(null);

  function navigate(s, data) {
    if (data) setCurrentWorkflow(data);
    setScreen(s);
  }

  return (
    <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', background: '#FCFCFD' }}>
      <Header/>
      <div style={{ flex: 1, display: 'flex', overflow: 'hidden' }}>
        <Sidebar screen={screen} onNavigate={navigate}/>
        {screen === 'home' && <HomeScreen onNavigate={navigate}/>}
        {screen === 'dashboard' && <WorkflowsDashboard onNavigate={navigate}/>}
        {screen === 'new-workflow' && <NewWorkflowScreen onNavigate={navigate}/>}
        {screen === 'plan-review' && <PlanReviewScreen draft={currentWorkflow} onNavigate={navigate}/>}
        {screen === 'workflow-detail' && <WorkflowDetailView workflow={currentWorkflow} onNavigate={navigate}/>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
